name: Monthly ETF and RRP refresh

on:
  schedule:
    # 10:00 China Standard Time on the second day of each month.
    - cron: "0 2 2 * *"
  workflow_dispatch:
    inputs:
      end_date:
        description: "Inclusive data end date (YYYY-MM-DD); defaults to the previous calendar month-end"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monthly-research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk latexmk texlive-fonts-extra texlive-lang-chinese texlive-xetex

      - name: Resolve refresh end date
        id: dates
        env:
          INPUT_END_DATE: ${{ inputs.end_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_END_DATE}" ]]; then
            end_date="${INPUT_END_DATE}"
          else
            end_date="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%F)"
          fi
          if ! [[ "${end_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid end date: ${end_date}" >&2
            exit 1
          fi
          echo "end_date=${end_date}" >> "${GITHUB_OUTPUT}"
          echo "Refreshing through ${end_date}"

      - name: Validate Tushare secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TUSHARE_TOKEN}" ]]; then
            echo "::error::Repository secret TUSHARE_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Refresh ETF prices
        run: >-
          python scripts/update_etf_data.py
          --provider tushare
          --start-date 20150101
          --end-date "${{ steps.dates.outputs.end_date }}"

      - name: Run the research pipeline
        run: python scripts/run_full_research_pipeline.py

      - name: Refresh monthly and supplementary artifacts
        run: |
          python scripts/run_asset_descriptive_statistics.py
          python scripts/run_sharpe_diff_tests.py
          python scripts/augment_supplementary_csvs.py
          python scripts/run_vol_aligned_comparison.py
          python scripts/run_monthly_hs300_comparison.py --end-date "${{ steps.dates.outputs.end_date }}"
          python scripts/generate_thesis_numbers.py

      - name: Compile thesis and defense PDFs
        shell: bash
        run: |
          set -euo pipefail
          cd report/thesis_latex
          for pass in 1 2 3; do
            latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          done
          cd ../ppt
          for pass in 1 2 3; do
            latexmk -xelatex -interaction=nonstopmode -halt-on-error rrp_defense.tex
          done

      - name: Clean temporary files
        if: always()
        run: python scripts/cleanup_temp.py

      - name: Commit refreshed artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md data/MANIFEST.json data/processed/etf_prices_updated.csv results report/thesis_latex report/ppt
          if git diff --cached --quiet; then
            echo "No refreshed artifacts changed."
            exit 0
          fi
          git commit -m "chore: refresh monthly research artifacts [skip ci]"
          git push origin HEAD:main
